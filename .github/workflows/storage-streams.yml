name: disposable-storage-streams
on:
  workflow_dispatch:
    inputs:
      disposable: {description: 'Enter YES for disposable storage only', required: true}
      driver:
        description: Native filesystem
        type: choice
        options: [btrfs, zfs]
        required: true
      parent: {description: 'Disposable path/dataset containing lxcer-test-', required: true}
permissions:
  contents: read
jobs:
  streams:
    if: inputs.disposable == 'YES'
    environment: isolated-lxd-tests
    runs-on: [self-hosted, linux, lxcer-disposable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.x'}
      - name: Verify real kernel streams and Restic chain recovery
        env:
          LXCER_TEST_DISPOSABLE: ${{ inputs.disposable }}
          LXCER_TEST_STORAGE_DRIVER: ${{ inputs.driver }}
          LXCER_TEST_STREAM_PARENT: ${{ inputs.parent }}
        run: go test -tags=storageintegration -run '^TestRealStorageStreamRoundTrip$' -v -timeout 25m ./...

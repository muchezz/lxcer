name: validation
on:
  pull_request:
  push:
    branches: [main, feat/lxcer-modernization]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y restic zstd
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go build -trimpath ./...
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

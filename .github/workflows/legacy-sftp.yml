name: disposable-legacy-303-sftp
on:
  workflow_dispatch:
    inputs:
      disposable: {description: 'Enter YES for disposable hosts only', required: true}
      source_remote: {description: 'lxcer-test-* LXD 3.0.3 Btrfs source', required: true}
      source_profile: {description: 'Source root-only profile', required: true}
      target_remote: {description: 'Separate lxcer-test-* restore host', required: true}
      target_profile: {description: 'Target root-only profile', required: true}
      image: {description: 'Trusted container image', required: true}
      pool: {description: 'Target restore pool', required: true}
      payload_mib: {description: 'Disposable payload MiB (16..4096)', default: '256', required: true}
permissions:
  contents: read
jobs:
  legacy:
    if: inputs.disposable == 'YES'
    environment: isolated-lxd-tests
    runs-on: [self-hosted, linux, lxcer-disposable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.x'}
      - name: Verify legacy backup, recovery and incomplete-backup exit
        env:
          LXCER_TEST_DISPOSABLE: ${{ inputs.disposable }}
          LXCER_TEST_REMOTE: ${{ inputs.source_remote }}
          LXCER_TEST_PROFILE: ${{ inputs.source_profile }}
          LXCER_TEST_RESTORE_REMOTE: ${{ inputs.target_remote }}
          LXCER_TEST_RESTORE_PROFILE: ${{ inputs.target_profile }}
          LXCER_TEST_IMAGE: ${{ inputs.image }}
          LXCER_TEST_POOL: ${{ inputs.pool }}
          LXCER_TEST_PAYLOAD_MIB: ${{ inputs.payload_mib }}
          LXCER_TEST_SFTP_REPOSITORY: ${{ secrets.LXCER_TEST_SFTP_REPOSITORY }}
          LXCER_TEST_RESTIC_PASSWORD: ${{ secrets.LXCER_TEST_RESTIC_PASSWORD }}
        run: go test -tags=lxdintegration -run '^TestLegacy303BtrfsSFTP$' -v -timeout 130m ./...

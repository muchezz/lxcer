name: prepare-release-artifacts
on:
  workflow_dispatch:
    inputs:
      version:
        description: Approved version identifier (artifacts only; no publication)
        required: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Build reproducible Linux artifacts
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: ./scripts/build-release.sh "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: lxcer-release
          path: dist/

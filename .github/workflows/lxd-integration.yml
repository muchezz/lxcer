name: isolated-lxd-integration
on:
  workflow_dispatch:
    inputs:
      disposable:
        description: Enter YES only for the dedicated disposable runner
        required: true
      remote:
        description: Dedicated lxcer-test-* LXD remote
        required: true
      profile:
        description: Preconfigured root-only profile
        required: true
      image:
        description: Trusted test image reference
        required: true
      pool:
        description: Storage pool on the disposable host
        required: true
      expected_version:
        description: Expected LXD version (3.0.3, 4.0, 5.0 or 6)
        required: true
      expected_driver:
        description: Expected pool driver (btrfs, zfs, lvm, dir or ceph)
        required: true
permissions:
  contents: read
jobs:
  integration:
    if: inputs.disposable == 'YES'
    environment: isolated-lxd-tests
    runs-on: [self-hosted, linux, lxcer-disposable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Exercise disposable instances only
        env:
          LXCER_TEST_DISPOSABLE: ${{ inputs.disposable }}
          LXCER_TEST_REMOTE: ${{ inputs.remote }}
          LXCER_TEST_PROFILE: ${{ inputs.profile }}
          LXCER_TEST_IMAGE: ${{ inputs.image }}
          LXCER_TEST_POOL: ${{ inputs.pool }}
          LXCER_TEST_EXPECT_VERSION: ${{ inputs.expected_version }}
          LXCER_TEST_EXPECT_DRIVER: ${{ inputs.expected_driver }}
        run: go test -tags=lxdintegration -run '^TestIsolatedLXD$' -v -timeout 40m ./...
